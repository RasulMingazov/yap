complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # Backtick scenario names are the test convention.
    excludes:
      - '**/test/**'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
  MaxLineLength:
    active: false
